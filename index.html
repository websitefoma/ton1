<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Roulette Simulator</title>
    <style>
        :root {
            --bg-dark: #0e1014;
            --panel-bg: #161920;
            --panel-border: #242936;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --t-color: #de9b35;
            --ct-color: #4b8df8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .roulette-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--t-color), var(--ct-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn:hover:not(:disabled) {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .btn:disabled {
            background: #1e293b;
            color: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-reset {
            background: #334155;
            box-shadow: none;
        }
        .btn-reset:hover:not(:disabled) {
            background: #475569;
            box-shadow: none;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 240px 1fr 240px;
            gap: 25px;
            margin-bottom: 30px;
        }

        .team-column {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .team-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
        }

        .team-column.t .team-title { color: var(--t-color); }
        .team-column.ct .team-title { color: var(--ct-color); }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e222b;
            border: 1px solid transparent;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .team-column.t .player-card { border-left: 4px solid var(--t-color); }
        .team-column.ct .player-card { border-left: 4px solid var(--ct-color); }

        .player-card.dead {
            opacity: 0.25;
            filter: grayscale(100%);
            background: #11141a;
            border-left-color: var(--text-muted);
        }

        .player-card.winner {
            opacity: 1 !important;
            filter: none !important;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            border-left: 4px solid var(--accent-green);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            animation: pulse-winner 2s infinite;
        }

        .player-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 140px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
        }
        .player-card.dead .status-dot {
            background: var(--accent-red);
        }

        .screen-container {
            position: relative;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        #matchVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .screen-placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }

        .screen-placeholder .icon {
            font-size: 32px;
            margin-bottom: 10px;
            color: #334155;
        }

        .winner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .winner-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-box {
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .winner-overlay.active .winner-box {
            transform: scale(1);
        }

        .winner-box h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .winner-box .name {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .pool-section {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
        }

        .pool-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .pool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-height: 130px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .pool-grid::-webkit-scrollbar {
            width: 6px;
        }
        .pool-grid::-webkit-scrollbar-thumb {
            background: #242936;
            border-radius: 4px;
        }

        .pool-item {
            background: #181b24;
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #94a3b8;
        }

        .pool-item.active-player {
            border-color: #2563eb;
            background: rgba(37, 99, 235, 0.08);
            color: #ffffff;
        }

        .pool-item.won-player {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            font-weight: bold;
        }

        @keyframes pulse-winner {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .team-column {
                order: 2;
            }
            .screen-container {
                order: 1;
            }
        }
    </style>
</head>
<body>

    <div class="roulette-wrapper">
        <div class="header">
            <h1>CS2 Roulette Engine</h1>
            <p>Модуль динамической синхронизации раундов и распределения пула ставок</p>
        </div>

        <div class="controls">
            <button class="btn" id="btnPrepare">Подготовить раунд</button>
            <button class="btn" id="btnStart" disabled>Запустить анимацию</button>
            <button class="btn btn-reset" id="btnReset">Сброс</button>
        </div>

        <div class="main-layout">
            <!-- Террористы -->
            <div class="team-column t">
                <div class="team-title">Terrorists (T)</div>
                <div class="player-card" id="t-1"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="t-2"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="t-3"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="t-4"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="t-5"><span class="player-name">-</span><div class="status-dot"></div></div>
            </div>

            <!-- Экран симуляции -->
            <div class="screen-container">
                <div class="screen-placeholder" id="placeholder">
                    <div class="icon">⚔️</div>
                    <div class="text">Ожидание инициализации пула участников</div>
                </div>
                
                <video id="matchVideo" preload="auto" playsinline></video>

                <div class="winner-overlay" id="overlay">
                    <div class="winner-box">
                        <h2>Победитель раунда</h2>
                        <div class="name" id="winnerDisplay">-</div>
                    </div>
                </div>
            </div>

            <!-- Спецназ -->
            <div class="team-column ct">
                <div class="team-title">Counter-Terrorists (CT)</div>
                <div class="player-card" id="ct-1"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="ct-2"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="ct-3"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="ct-4"><span class="player-name">-</span><div class="status-dot"></div></div>
                <div class="player-card" id="ct-5"><span class="player-name">-</span><div class="status-dot"></div></div>
            </div>
        </div>

        <!-- Секция участников -->
        <div class="pool-section">
            <div class="pool-title">
                <span>Общий пул участников раунда</span>
                <span id="poolCount">Всего: 0</span>
            </div>
            <div class="pool-grid" id="poolGrid"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            baseUrl: "https://velgardi.ru/",
            totalConfigs: 41
        };

        // UI Элементы
        const btnPrepare = document.getElementById('btnPrepare');
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');
        const matchVideo = document.getElementById('matchVideo');
        const placeholder = document.getElementById('placeholder');
        const overlay = document.getElementById('overlay');
        const winnerDisplay = document.getElementById('winnerDisplay');
        const poolGrid = document.getElementById('poolGrid');
        const poolCount = document.getElementById('poolCount');

        const tCards = Array.from({length: 5}, (_, i) => document.getElementById(`t-${i+1}`));
        const ctCards = Array.from({length: 5}, (_, i) => document.getElementById(`ct-${i+1}`));

        // Системные переменные
        let globalPool = [];
        let activeMatchPlayers = [];
        let matchTimeline = [];
        let matchWinner = null;
        let runningTimelineIndex = 0;
        let isSimulating = false;

        // Генерация фейковых участников при старте для демонстрации работы автономно
        function generateDemoPool() {
            const demo = [];
            for(let i = 1; i <= 30; i++) {
                demo.push({ id: i, name: `User_#${1000 + Math.floor(Math.random() * 9000)}` });
            }
            return demo;
        }

        function renderPool() {
            poolGrid.innerHTML = '';
            poolCount.textContent = `Всего: ${globalPool.length}`;
            globalPool.forEach(player => {
                const item = document.createElement('div');
                item.className = 'pool-item';
                item.id = `pool-p-${player.name}`;
                item.textContent = player.name;
                poolGrid.appendChild(item);
            });
        }

        // Парсер временной метки (MM:SS или SS.MS) -> секунды
        function timeToSeconds(str) {
            const p = str.split(':');
            if(p.length === 2) {
                return parseInt(p[0], 10) * 60 + parseFloat(p[1]);
            }
            return parseFloat(str);
        }

        // Загрузка конфигурации раунда
        async function loadRoundConfig(id) {
            try {
                const response = await fetch(`${CONFIG.baseUrl}${id}.txt`);
                if (!response.ok) throw new Error("Сетевая ошибка при загрузке конфига");
                const text = await response.text();
                
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if(lines.length < 2) throw new Error("Невалидный формат файла конфига");

                // Видео всегда берем из первой строки (например: cs1.webm)
                const videoFile = lines[0];
                const parsedTimeline = [];
                let parsedWinner = null;

                for(let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    if(line.startsWith('pob')) {
                        // Определение победителя (pobtp3 / pobcp2)
                        const isT = line.startsWith('pobtp');
                        const index = parseInt(line.replace('pobtp', '').replace('pobcp', ''), 10) - 1;
                        parsedWinner = { team: isT ? 't' : 'ct', index };
                    } else {
                        // Парсинг событий смерти (0:12 cp3)
                        const parts = line.split(' ');
                        if(parts.length === 2) {
                            const time = timeToSeconds(parts[0]);
                            const cmd = parts[1].trim();
                            const isT = cmd.startsWith('tp');
                            const index = parseInt(cmd.replace('tp', '').replace('cp', ''), 10) - 1;
                            parsedTimeline.push({ time, team: isT ? 't' : 'ct', index });
                        }
                    }
                }

                // Сортируем таймлайн по возрастанию времени
                parsedTimeline.sort((a, b) => a.time - b.time);

                return {
                    videoUrl: `${CONFIG.baseUrl}${videoFile}`,
                    timeline: parsedTimeline,
                    winner: parsedWinner
                };

            } catch (err) {
                console.warn(`Не удалось загрузить оригинальный конфиг #${id}. Включен резервный режим симуляции.`, err);
                return getFallbackConfig();
            }
        }

        // Фолбэк на случай если запуск локальный (без веб-сервера / CORS)
        function getFallbackConfig() {
            return {
                videoUrl: `${CONFIG.baseUrl}cs1.webm`,
                timeline: [
                    { time: 3.5, team: 't', index: 2 },
                    { time: 6.2, team: 'ct', index: 0 },
                    { time: 9.1, team: 't', index: 4 },
                    { time: 12.0, team: 't', index: 0 }
                ],
                winner: { team: 'ct', index: 1 } // Выживает CT под номером 2
            };
        }

        // Подготовка данных матча
        async function prepareRound() {
            if(globalPool.length < 10) {
                alert("Недостаточно игроков для запуска матча! (Минимум 10)");
                return;
            }

            btnPrepare.disabled = true;
            placeholder.querySelector('.text').textContent = "Конфигурация сценария, предзагрузка ресурсов...";

            // Очищаем старые стили
            resetVisuals();

            // Выборка 10 случайных участников
            const shuffled = [...globalPool].sort(() => Math.random() - 0.5);
            activeMatchPlayers = shuffled.slice(0, 10);

            // Подсвечиваем выбранных в пуле
            activeMatchPlayers.forEach(p => {
                const el = document.getElementById(`pool-p-${p.name}`);
                if(el) el.classList.add('active-player');
            });

            // Распределяем по картам команд
            for(let i = 0; i < 5; i++) {
                tCards[i].querySelector('.player-name').textContent = activeMatchPlayers[i].name;
                ctCards[i].querySelector('.player-name').textContent = activeMatchPlayers[i + 5].name;
            }

            // Рандомим конфиг
            const randomConfigId = Math.floor(Math.random() * CONFIG.totalConfigs) + 1;
            const configData = await loadRoundConfig(randomConfigId);

            matchTimeline = configData.timeline;
            matchWinner = configData.winner;

            // Настройка тега видео
            matchVideo.src = configData.videoUrl;
            matchVideo.load();

            matchVideo.oncanplaythrough = () => {
                placeholder.style.display = 'none';
                matchVideo.style.display = 'block';
                btnStart.disabled = false;
                btnPrepare.disabled = false;
            };

            matchVideo.onerror = () => {
                placeholder.querySelector('.text').textContent = "Ошибка загрузки видеофайла. Попробуйте снова.";
                btnPrepare.disabled = false;
            };
        }

        // Запуск анимации / воспроизведения
        function startSimulation() {
            if(isSimulating || !matchVideo.src) return;
            isSimulating = true;
            btnStart.disabled = true;
            btnPrepare.disabled = true;
            runningTimelineIndex = 0;

            matchVideo.addEventListener('timeupdate', checkTimelineEvents);
            matchVideo.addEventListener('ended', finishSimulation);

            matchVideo.play().catch(err => {
                console.error("Ошибка воспроизведения медиа:", err);
                finishSimulation(); // Безопасное завершение при ошибке автоплея
            });
        }

        // Отслеживание событий выбывания во время проигрывания
        function checkTimelineEvents() {
            const currentVideoTime = matchVideo.currentTime;

            while(runningTimelineIndex < matchTimeline.length && currentVideoTime >= matchTimeline[runningTimelineIndex].time) {
                const event = matchTimeline[runningTimelineIndex];
                eliminatePlayer(event.team, event.index);
                runningTimelineIndex++;
            }
        }

        // Убийство игрока на панели
        function eliminatePlayer(team, index) {
            const card = team === 't' ? tCards[index] : ctCards[index];
            if(card && !card.classList.contains('dead')) {
                card.classList.add('dead');
            }
        }

        // Финал розыгрыша
        function finishSimulation() {
            matchVideo.removeEventListener('timeupdate', checkTimelineEvents);
            matchVideo.removeEventListener('ended', finishSimulation);

            if(matchWinner) {
                let absoluteWinnerIndex = matchWinner.team === 't' ? matchWinner.index : matchWinner.index + 5;
                let winnerUserData = activeMatchPlayers[absoluteWinnerIndex];

                if(winnerUserData) {
                    // Подсвечиваем карточку
                    const winnerCard = matchWinner.team === 't' ? tCards[matchWinner.index] : ctCards[matchWinner.index];
                    if(winnerCard) {
                        winnerCard.classList.remove('dead');
                        winnerCard.classList.add('winner');
                    }

                    // Подсвечиваем в пуле
                    const poolBadge = document.getElementById(`pool-p-${winnerUserData.name}`);
                    if(poolBadge) {
                        poolBadge.classList.remove('active-player');
                        poolBadge.classList.add('won-player');
                    }

                    // Оверлей
                    winnerDisplay.textContent = winnerUserData.name;
                    overlay.classList.add('active');

                    // Внешний интеграционный триггер для бэкенда
                    triggerExternalBackendCallback(winnerUserData.name);
                }
            }

            isSimulating = false;
            btnPrepare.disabled = false;
        }

        function resetVisuals() {
            overlay.classList.remove('active');
            winnerDisplay.textContent = '-';
            
            tCards.forEach(card => {
                card.className = 'player-card';
                card.querySelector('.player-name').textContent = '-';
            });
            ctCards.forEach(card => {
                card.className = 'player-card';
                card.querySelector('.player-name').textContent = '-';
            });

            // Очищаем классы из пула
            const badges = poolGrid.querySelectorAll('.pool-item');
            badges.forEach(b => {
                b.className = 'pool-item';
            });
        }

        function hardReset() {
            matchVideo.pause();
            matchVideo.src = "";
            matchVideo.style.display = 'none';
            placeholder.style.display = 'flex';
            placeholder.querySelector('.text').textContent = "Ожидание инициализации пула участников";
            
            resetVisuals();
            btnStart.disabled = true;
            isSimulating = false;
            btnPrepare.disabled = false;

            // Перезапускаем пулл
            globalPool = generateDemoPool();
            renderPool();
        }

        // Пример триггера для внешней API-интеграции
        function triggerExternalBackendCallback(winnerName) {
            console.log(`[Roulette Engine Result] Победитель раунда зафиксирован: ${winnerName}`);
            // Сюда помещается ваш код отправки AJAX на бэкенд сайта розыгрышей
        }

        // Слушатели событий
        btnPrepare.addEventListener('click', prepareRound);
        btnStart.addEventListener('click', startSimulation);
        btnReset.addEventListener('click', hardReset);

        // Старт системы
        document.addEventListener('DOMContentLoaded', () => {
            globalPool = generateDemoPool();
            renderPool();
        });
    </script>
</body>
</html>
